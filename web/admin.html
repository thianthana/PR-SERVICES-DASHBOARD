<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>จัดการระบบ · PR Portal</title><link rel="stylesheet" href="portal.css"><script defer src="js/config.js"></script><script defer src="js/auth.js"></script><script defer src="js/ui.js"></script><script defer src="js/admin.js"></script></head><body><div class="shell"><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark"></span>PR Portal</a><nav class="nav" aria-label="เมนูหลัก"><a class="" href="dashboard.html">รวมบริการ</a><a id="adminLink" class="current" href="admin.html" >จัดการระบบ</a><button class="quiet" id="logout">ออกจากระบบ</button></nav><div class="profile" id="profile"></div></header><div class="page-head"><div><div class="eyebrow">ADMIN WORKSPACE</div><h1>จัดการระบบ</h1></div><button id="reload" class="quiet">โหลดข้อมูลใหม่</button></div><div id="message" role="status" aria-live="polite" hidden></div><div id="loading" class="loader">กำลังตรวจสอบสิทธิ์ผู้ดูแล…</div><main id="content" hidden><div class="tabs" role="tablist" aria-label="ตั้งค่าระบบ"><button role="tab" id="usersTab" aria-controls="usersPanel" aria-selected="true">ผู้ใช้และสิทธิ์</button><button role="tab" id="servicesTab" aria-controls="servicesPanel" aria-selected="false" tabindex="-1">จัดการบริการ</button></div><section id="usersPanel" role="tabpanel" aria-labelledby="usersTab" class="admin-grid"><aside class="panel"><label>ค้นหาผู้ใช้<input id="userSearch" type="search" placeholder="ชื่อหรืออีเมล"></label><div id="users" class="user-list" style="margin-top:18px"></div></aside><div id="userEditor" class="panel"><p class="muted">เลือกผู้ใช้เพื่อตั้งค่าบริการที่มองเห็น</p></div></section><section id="servicesPanel" role="tabpanel" aria-labelledby="servicesTab" class="panel" hidden><div class="page-head" style="margin-top:0"><div><h2>บริการทั้งหมด</h2><p class="muted small">อัปโหลด HTML เข้า Git แล้วเลือกไฟล์เพื่อเชื่อมบริการ</p></div><button id="addService" class="primary">เพิ่มบริการ</button></div><div class="table-wrap"><table><thead><tr><th>บริการ</th><th>ไฟล์ที่เชื่อมโยง</th><th>สถานะ</th><th>ลำดับ</th><th>จัดการ</th></tr></thead><tbody id="serviceRows"></tbody></table></div></section></main><dialog id="serviceDialog" aria-labelledby="dialogTitle"><form id="serviceForm"><div class="dialog-head"><h2 id="dialogTitle">เพิ่มบริการ</h2><button class="quiet close" type="button" id="closeDialog" aria-label="ปิด">×</button></div><div id="dialogError" class="message error" role="alert" hidden></div><div class="fields"><label>รหัสบริการ (ภาษาอังกฤษ เช่น media)<input name="id" pattern="[a-z][a-z0-9-]{1,49}" maxlength="50" required></label><label>ชื่อบริการ<input name="name" maxlength="80" required></label><label>คำอธิบาย<textarea name="description" maxlength="180"></textarea></label><label>ไฟล์ HTML<select name="path" required></select></label><div class="two-cols"><label>ไอคอน<select name="icon"><option value="media">สื่อ</option><option value="survey">แบบสอบถาม</option><option value="document">เอกสาร</option><option value="calendar">ปฏิทิน</option><option value="payment">ชำระเงิน</option><option value="support">ช่วยเหลือ</option><option value="folder">โฟลเดอร์</option><option value="chart">รายงาน</option></select></label><label>ลำดับ (น้อยขึ้นก่อน)<input name="sort_order" type="number" min="-10000" max="10000" value="1" required></label></div><label class="check"><input type="checkbox" name="enabled" checked>เปิดใช้งานบริการ</label></div><div class="actions"><button class="primary" id="saveService" type="submit">บันทึกบริการ</button></div></form></dialog></div></body></html>
