<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วิเคราะห์แบบสอบถาม — PR Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #07090f; margin: 0; min-height: 100vh; }
        
        .liquid-container { position: fixed; width: 100vw; height: 100vh; top: 0; left: 0; z-index: -1; overflow: hidden; background: #07090f; }
        .blob { position: absolute; filter: blur(80px); opacity: 0.5; animation: move-liquid 25s infinite alternate ease-in-out; }
        .blob-1 { width: 35vw; height: 35vw; background: linear-gradient(135deg, #d946ef, #a855f7); top: -10%; left: -5%; border-radius: 43% 57% 70% 30% / 44% 45% 55% 56%; animation-duration: 30s; }
        .blob-2 { width: 30vw; height: 30vw; background: linear-gradient(135deg, #8b5cf6, #6366f1); bottom: -15%; right: 10%; border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; animation-duration: 25s; animation-delay: -8s; }
        @keyframes move-liquid { 0% { transform: translate(0, 0) rotate(0deg) scale(1); } 50% { transform: translate(8vw, -8vh) rotate(180deg) scale(1.1); } 100% { transform: translate(-4vw, 4vh) rotate(360deg) scale(1); } }

        .glass { background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-panel { background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.015) 100%); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-top: 1px solid rgba(255, 255, 255, 0.15); }
        
        .liquid-input { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.08); color: white; transition: all 0.3s ease; }
        .liquid-input:focus { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
        .liquid-input::placeholder { color: rgba(255,255,255,0.3); }

        .liquid-btn { background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,255,255,0.8)); color: #111; box-shadow: 0 8px 20px -5px rgba(255,255,255,0.3); transition: all 0.3s ease; }
        .liquid-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px -5px rgba(255,255,255,0.4); }

        #authLoading { transition: opacity 0.5s ease; }
        #mainContent { opacity: 0; transition: opacity 0.6s ease; }
        #mainContent.loaded { opacity: 1; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in-up { animation: fadeInUp 0.5s ease forwards; opacity: 0; }

        /* File drop zone */
        .drop-zone { border: 2px dashed rgba(255,255,255,0.15); transition: all 0.3s ease; }
        .drop-zone:hover, .drop-zone.drag-over { border-color: rgba(168, 85, 247, 0.5); background: rgba(168, 85, 247, 0.05); }
        .drop-zone.drag-over { transform: scale(1.02); }

        select { appearance: none; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='white'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M19 9l-7 7-7-7'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 12px center; background-size: 16px; }
    </style>
</head>
<body class="min-h-screen text-white">

    <div class="liquid-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Auth Loading -->
    <div id="authLoading" class="fixed inset-0 z-[100] bg-[#07090f] flex items-center justify-center">
        <div class="flex flex-col items-center">
            <svg class="w-8 h-8 animate-spin text-fuchsia-400 mb-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p class="text-sm text-gray-300 font-light">กำลังตรวจสอบสิทธิ์...</p>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainContent" class="relative z-10">
        <!-- Header -->
        <header class="glass border-b border-white/5 sticky top-0 z-50">
            <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <!-- ปุ่มกลับเมนูหลัก -->
                    <button onclick="window.location.href='dashboard.html'" class="w-10 h-10 rounded-2xl bg-white/10 border border-white/15 flex items-center justify-center hover:bg-white/20 transition-all hover:scale-110 active:scale-95" title="กลับเมนูหลัก">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                    <div>
                        <h1 class="text-lg font-semibold leading-tight">วิเคราะห์ข้อมูลแบบสอบถาม</h1>
                        <p class="text-[10px] text-fuchsia-300 uppercase tracking-[0.2em] opacity-80">Survey Data Analytics</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="text-xs text-gray-500 font-mono" id="sessionTimer">—</div>
                    <button onclick="handleLogout()" class="w-10 h-10 rounded-2xl bg-rose-500/20 border border-rose-500/30 flex items-center justify-center hover:bg-rose-500/30 transition-all" title="ออกจากระบบ">
                        <svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Content -->
        <main class="max-w-6xl mx-auto px-6 py-8">

            <!-- File Upload -->
            <div class="glass-panel rounded-3xl p-8 mb-8 fade-in-up" style="animation-delay: 0.1s">
                <h3 class="text-lg font-semibold mb-6 flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl bg-fuchsia-500/20 border border-fuchsia-500/30 flex items-center justify-center">
                        <svg class="w-4 h-4 text-fuchsia-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    </div>
                    นำเข้าข้อมูลแบบสอบถาม
                </h3>

                <!-- Upload Zone -->
                <div id="dropZone" class="drop-zone rounded-2xl p-10 text-center cursor-pointer" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" class="hidden" onchange="handleFile(this)">
                    <svg class="w-12 h-12 text-gray-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <p class="text-gray-400 font-light mb-2">ลากไฟล์มาวางที่นี่ หรือ <span class="text-fuchsia-400 font-medium underline">เลือกไฟล์</span></p>
                    <p class="text-xs text-gray-600">รองรับ .CSV, .XLSX, .XLS</p>
                </div>

                <!-- หรือดึงจาก Google Sheets -->
                <div class="mt-6 flex items-center gap-4">
                    <div class="h-px flex-1 bg-white/10"></div>
                    <span class="text-xs text-gray-500 uppercase tracking-widest">หรือ</span>
                    <div class="h-px flex-1 bg-white/10"></div>
                </div>

                <div class="mt-6">
                    <label class="text-xs text-gray-400 ml-1 mb-2 block">URL ของ Google Sheets (ต้องแชร์เป็นสาธารณะ)</label>
                    <div class="flex gap-3">
                        <input type="url" id="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/..." class="liquid-input flex-1 px-4 py-3 rounded-xl outline-none text-sm">
                        <button onclick="loadFromSheet()" class="liquid-btn px-6 py-3 rounded-xl text-sm font-semibold flex-shrink-0">โหลดข้อมูล</button>
                    </div>
                </div>
            </div>

            <!-- Analysis Options -->
            <div class="glass-panel rounded-3xl p-8 mb-8 fade-in-up" style="animation-delay: 0.2s">
                <h3 class="text-lg font-semibold mb-6 flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl bg-purple-500/20 border border-purple-500/30 flex items-center justify-center">
                        <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </div>
                    ตั้งค่าการวิเคราะห์
                </h3>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="text-xs text-gray-400 ml-1 mb-1 block">ประเภทการวิเคราะห์</label>
                        <select class="liquid-input w-full px-4 py-3 rounded-xl outline-none text-sm pr-10">
                            <option>ค่าเฉลี่ย / ค่ามัธยฐาน / SD</option>
                            <option>ตารางความถี่ (Frequency)</option>
                            <option>Cross Tabulation</option>
                            <option>ความพึงพอใจ (Satisfaction)</option>
                            <option>วิเคราะห์ข้อความเปิด</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 ml-1 mb-1 block">รูปแบบกราฟ</label>
                        <select class="liquid-input w-full px-4 py-3 rounded-xl outline-none text-sm pr-10">
                            <option>Bar Chart</option>
                            <option>Pie Chart</option>
                            <option>Line Chart</option>
                            <option>Radar Chart</option>
                            <option>Horizontal Bar</option>
                        </select>
                    </div>
                </div>

                <button onclick="runAnalysis()" class="liquid-btn px-8 py-3 rounded-xl text-sm font-semibold flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    เริ่มวิเคราะห์
                </button>
            </div>

            <!-- Results Area -->
            <div class="glass-panel rounded-3xl p-8 fade-in-up" style="animation-delay: 0.3s">
                <h3 class="text-lg font-semibold mb-6 flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center">
                        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    ผลการวิเคราะห์
                </h3>
                <div id="analysisResult" class="text-center py-16">
                    <svg class="w-16 h-16 text-gray-700 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <p class="text-gray-500 font-light">นำเข้าข้อมูลและกด "เริ่มวิเคราะห์" เพื่อดูผลลัพธ์</p>
                    <p class="text-xs text-gray-600 mt-2">ระบบจะวิเคราะห์และสร้างกราฟอัตโนมัติ</p>
                </div>
            </div>

        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Auth Guard
        (async function() {
            const authOk = await Auth.requireAuth();
            if (!authOk) return;
            const loading = document.getElementById('authLoading');
            loading.style.opacity = '0';
            setTimeout(() => { loading.style.display = 'none'; document.getElementById('mainContent').classList.add('loaded'); }, 500);

            setInterval(() => {
                const s = Auth.getSession();
                if (s) {
                    const idle = Math.floor((Date.now() - s.lastActivity) / 1000);
                    const remaining = Math.max(0, (CONFIG.SESSION_TIMEOUT / 1000) - idle);
                    const m = Math.floor(remaining / 60);
                    const sec = remaining % 60;
                    document.getElementById('sessionTimer').textContent = `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
                }
            }, 1000);
        })();

        async function handleLogout() {
            if (confirm('ต้องการออกจากระบบ?')) await Auth.logout('manual');
        }

        // File drag & drop
        const dropZone = document.getElementById('dropZone');
        ['dragenter', 'dragover'].forEach(evt => dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.add('drag-over'); }));
        ['dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.remove('drag-over'); }));
        dropZone.addEventListener('drop', e => { if (e.dataTransfer.files.length) handleFile({ files: e.dataTransfer.files }); });

        function handleFile(input) {
            const file = input.files[0];
            if (!file) return;
            dropZone.innerHTML = `
                <div class="flex items-center justify-center gap-3">
                    <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <div class="text-left">
                        <p class="text-white font-medium">${file.name}</p>
                        <p class="text-xs text-gray-400">${(file.size / 1024).toFixed(1)} KB — พร้อมวิเคราะห์</p>
                    </div>
                </div>
            `;
        }

        function loadFromSheet() {
            const url = document.getElementById('sheetUrl').value;
            if (!url) { alert('กรุณาใส่ URL ของ Google Sheets'); return; }
            alert('ฟีเจอร์โหลดจาก Google Sheets จะพร้อมใช้งานเร็วๆ นี้');
        }

        function runAnalysis() {
            const result = document.getElementById('analysisResult');
            result.innerHTML = '<div class="flex flex-col items-center py-10"><svg class="w-10 h-10 animate-spin text-fuchsia-400 mb-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><p class="text-sm text-gray-300">กำลังวิเคราะห์ข้อมูล...</p></div>';

            setTimeout(() => {
                result.innerHTML = `
                    <div class="text-left">
                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                            <div class="bg-white/5 rounded-xl p-4 text-center border border-white/5">
                                <p class="text-xs text-gray-400 mb-1">จำนวนผู้ตอบ</p>
                                <p class="text-2xl font-bold text-fuchsia-400">156</p>
                            </div>
                            <div class="bg-white/5 rounded-xl p-4 text-center border border-white/5">
                                <p class="text-xs text-gray-400 mb-1">ค่าเฉลี่ยรวม</p>
                                <p class="text-2xl font-bold text-emerald-400">4.32</p>
                            </div>
                            <div class="bg-white/5 rounded-xl p-4 text-center border border-white/5">
                                <p class="text-xs text-gray-400 mb-1">ค่า SD</p>
                                <p class="text-2xl font-bold text-amber-400">0.67</p>
                            </div>
                            <div class="bg-white/5 rounded-xl p-4 text-center border border-white/5">
                                <p class="text-xs text-gray-400 mb-1">ระดับ</p>
                                <p class="text-2xl font-bold text-cyan-400">มาก</p>
                            </div>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-sm">
                                <thead>
                                    <tr class="border-b border-white/10">
                                        <th class="text-left py-3 px-4 text-gray-400 font-medium">หัวข้อ</th>
                                        <th class="text-center py-3 px-4 text-gray-400 font-medium">Mean</th>
                                        <th class="text-center py-3 px-4 text-gray-400 font-medium">SD</th>
                                        <th class="text-center py-3 px-4 text-gray-400 font-medium">ระดับ</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="border-b border-white/5 hover:bg-white/5 transition-colors">
                                        <td class="py-3 px-4 text-gray-300">ด้านคุณภาพเนื้อหา</td>
                                        <td class="py-3 px-4 text-center font-medium text-emerald-400">4.52</td>
                                        <td class="py-3 px-4 text-center text-gray-400">0.58</td>
                                        <td class="py-3 px-4 text-center"><span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded-full border border-emerald-500/30">มากที่สุด</span></td>
                                    </tr>
                                    <tr class="border-b border-white/5 hover:bg-white/5 transition-colors">
                                        <td class="py-3 px-4 text-gray-300">ด้านการให้บริการ</td>
                                        <td class="py-3 px-4 text-center font-medium text-emerald-400">4.38</td>
                                        <td class="py-3 px-4 text-center text-gray-400">0.65</td>
                                        <td class="py-3 px-4 text-center"><span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-1 rounded-full border border-blue-500/30">มาก</span></td>
                                    </tr>
                                    <tr class="border-b border-white/5 hover:bg-white/5 transition-colors">
                                        <td class="py-3 px-4 text-gray-300">ด้านความสะดวกสบาย</td>
                                        <td class="py-3 px-4 text-center font-medium text-emerald-400">4.21</td>
                                        <td class="py-3 px-4 text-center text-gray-400">0.72</td>
                                        <td class="py-3 px-4 text-center"><span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-1 rounded-full border border-blue-500/30">มาก</span></td>
                                    </tr>
                                    <tr class="hover:bg-white/5 transition-colors">
                                        <td class="py-3 px-4 text-gray-300">ด้านภาพรวม</td>
                                        <td class="py-3 px-4 text-center font-medium text-emerald-400">4.15</td>
                                        <td class="py-3 px-4 text-center text-gray-400">0.71</td>
                                        <td class="py-3 px-4 text-center"><span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-1 rounded-full border border-blue-500/30">มาก</span></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="mt-6 flex flex-col sm:flex-row gap-3">
                            <button class="px-6 py-3 rounded-xl text-sm font-medium bg-white/10 border border-white/15 text-white hover:bg-white/20 transition-all flex items-center justify-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                ส่งออก PDF
                            </button>
                            <button class="px-6 py-3 rounded-xl text-sm font-medium bg-white/10 border border-white/15 text-white hover:bg-white/20 transition-all flex items-center justify-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                ส่งออก Excel
                            </button>
                        </div>

                        <p class="text-xs text-gray-600 mt-6 text-center">ข้อมูลตัวอย่าง — เชื่อมต่อข้อมูลจริงเพื่อผลลัพธ์ที่ถูกต้อง</p>
                    </div>
                `;
            }, 2500);
        }
    </script>
</body>
</html>
